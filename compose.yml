services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: craftsmen-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./packages/db/init/databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
volumes:
  pgdata:
